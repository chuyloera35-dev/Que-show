<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff2295"><link rel="manifest" href="/manifest.json"><title>Qué Show</title><style>
:root{--p:#ff2295;--g:#16c957;--bg:#f6f7fb;--ink:#171722;--muted:#77798a;--line:#ececf2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 0 0,#ffd4ec,transparent 35%),radial-gradient(circle at 100% 100%,#caffd8,transparent 30%)}.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 20px 70px #0001}.logo{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.brand{text-align:center;font-size:31px;font-weight:900}.muted{color:var(--muted)}.field{width:100%;border:1px solid #dddde6;border-radius:14px;padding:13px 14px;margin:6px 0;outline:none}.field:focus{border-color:var(--p);box-shadow:0 0 0 3px #ff22951a}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),#ff0b76);color:#fff}.full{width:100%}.link{border:0;background:none;color:var(--p);font-weight:800;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:340px 1fr}.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.top{padding:15px;display:flex;align-items:center;justify-content:space-between}.mini{width:42px;height:42px;object-fit:contain}.me{display:flex;align-items:center;gap:9px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--g));color:#fff;font-weight:900}.nav{display:flex;gap:6px;padding:0 12px 10px}.nav button{flex:1;border:0;border-radius:12px;padding:9px;background:#f2f3f7;cursor:pointer}.nav button.active{background:#ffe8f4;color:#c70069}.search{margin:0 14px 10px}.list{overflow:auto;flex:1}.row{display:flex;gap:10px;padding:12px 15px;cursor:pointer;border-left:3px solid transparent}.row:hover,.row.active{background:#fff0f7;border-left-color:var(--p)}.row b{display:block}.row small{color:var(--muted)}.chat{display:flex;flex-direction:column;min-width:0}.head{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px 18px;gap:10px}.messages{flex:1;overflow:auto;padding:20px;background:linear-gradient(#fafafd,#f5f7fb)}.bubble{max-width:min(75%,560px);padding:10px 13px;border-radius:17px;margin:7px 0;background:#fff;box-shadow:0 2px 10px #0000000b}.mine{margin-left:auto;background:linear-gradient(135deg,#ff2b9a,#ff4cae);color:#fff;border-bottom-right-radius:5px}.theirs{border-bottom-left-radius:5px}.time{font-size:10px;opacity:.65;margin-top:4px}.composer{display:flex;gap:8px;padding:11px;background:#fff;border-top:1px solid var(--line)}.composer .field{margin:0}.icon{width:46px;height:46px;border:0;border-radius:14px;background:#f1f2f7;cursor:pointer}.send{background:var(--g);color:#fff}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.panel{padding:18px;overflow:auto}.story{padding:12px;border:1px solid var(--line);background:#fff;border-radius:16px;margin:8px 0}.online{width:9px;height:9px;background:var(--g);border-radius:50%;display:inline-block}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{background:#fff;width:min(460px,100%);border-radius:22px;padding:20px}.toast{position:fixed;bottom:18px;right:18px;background:#171722;color:#fff;padding:12px 16px;border-radius:14px;z-index:30}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:absolute;inset:0;z-index:5}.chat{display:none}.chatopen .side{display:none}.chatopen .chat{display:flex}.back{display:block!important}.head{padding-top:calc(8px + env(safe-area-inset-top))}.nav{padding-bottom:8px}}
</style></head><body><div id="root"></div><script src="/socket.io/socket.io.js"></script><script>
let token=localStorage.getItem('qs_token'),me=null,users=[],groups=[],selected=null,mode='users',socket=null,online=new Set();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}
function auth(reg=false){root.innerHTML=`<div class=auth><div class=card><img class=logo src=/logo.svg><div class=brand>Qué Show</div><p class=muted style=text-align:center>Mensajería, grupos, estados y conexiones.</p><div id=err style=color:#c21b5f;text-align:center;min-height:24px></div><form id=af>${reg?'<input class=field id=name placeholder="Nombre" required>':''}<input class=field id=username placeholder="Usuario" required><input class=field id=password type=password placeholder="Contraseña" required>${reg?'<input class=field id=password2 type=password placeholder="Repite la contraseña" required>':''}<button class="btn primary full">${reg?'Crear cuenta':'Entrar'}</button></form><p style=text-align:center>${reg?'¿Ya tienes cuenta?':'¿No tienes cuenta?'} <button class=link id=sw>${reg?'Inicia sesión':'Regístrate'}</button></p></div></div>`;$('sw').onclick=()=>auth(!reg);$('af').onsubmit=async e=>{e.preventDefault();try{const body={username:$('username').value,password:$('password').value};if(reg){body.name=$('name').value;if(body.password!==$('password2').value)throw Error('Las contraseñas no coinciden.');}const d=await fetch(reg?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});localStorage.setItem('qs_token',d.token);token=d.token;start();}catch(e){$('err').textContent=e.message}}}
async function start(){try{me=await api('/api/me');users=await api('/api/users');groups=await api('/api/groups');render();socket=io({auth:{token}});socket.on('presence',p=>{p.online?online.add(p.id):online.delete(p.id);renderList();});socket.on('new_message',m=>{if(selected&&((mode==='users'&&m.sender_id===selected.id)||(mode==='groups'&&m.group_id===selected.id)))load();else toast('Nuevo mensaje 💬');});socket.on('message_sent',m=>{if(selected&&mode==='users'&&selected.id===m.receiver_id)load();});socket.on('call_signal',x=>handleCall(x));}catch{localStorage.removeItem('qs_token');token=null;auth();}}
function render(){root.innerHTML=`<div class=app id=app><aside class=side><div class=top><div class=me><img class=mini src=/logo.svg><div><b>Qué Show</b><div class=muted>@${esc(me.username)}</div></div></div><button class=icon id=menu>⚙</button></div><div class=nav><button id=nchat class=active>💬 Chats</button><button id=ngroup>👥 Grupos</button><button id=nstatus>⭕ Estados</button></div><input class=field id=search placeholder="Buscar..."><div class=list id=list></div></aside><main class=chat><header class=head id=head><button class="icon back" id=back style="display:none">‹</button><div id=who>Selecciona una conversación</div></header><section class=messages id=messages><div class=empty>💬<br>Elige un chat para comenzar.</div></section><form class=composer id=compose><input type=file id=file hidden><button type=button class=icon id=attach>📎</button><button type=button class=icon id=voice>🎙️</button><input class=field id=text placeholder="Escribe un mensaje..." autocomplete=off><button class="btn icon send">➤</button></form></main></div><div id=modal></div>`;$('menu').onclick=profile;$('back').onclick=()=>app.classList.remove('chatopen');$('attach').onclick=()=>file.click();$('compose').onsubmit=send;$('voice').onclick=voice;$('search').oninput=renderList;$('nchat').onclick=()=>{mode='users';nav();renderList()};$('ngroup').onclick=()=>{mode='groups';nav();renderList()};$('nstatus').onclick=()=>{mode='status';nav();renderList()};renderList();}
function nav(){['nchat','ngroup','nstatus'].forEach((x,i)=>$(x).classList.toggle('active',(mode==='users'&&i===0)||(mode==='groups'&&i===1)||(mode==='status'&&i===2)));}
function renderList(){const q=($('search')?.value||'').toLowerCase();const l=$('list');if(mode==='users')l.innerHTML=users.filter(u=>(u.name+' '+u.username).toLowerCase().includes(q)).map(u=>`<div class="row ${selected?.id===u.id?'active':''}" data-id=${u.id}><div class=avatar>${esc(u.name[0]?.toUpperCase())}</div><div><b>${esc(u.name)} ${online.has(u.id)?'<span class=online></span>':''}</b><small>@${esc(u.username)}</small></div></div>`).join('');else if(mode==='groups')l.innerHTML=`<button class="btn primary full" id=newg>＋ Crear grupo</button>`+groups.map(g=>`<div class="row ${selected?.id===g.id?'active':''}" data-id=${g.id}><div class=avatar>👥</div><div><b>${esc(g.name)}</b><small>Grupo</small></div></div>`).join('');else l.innerHTML=`<button class="btn primary full" id=news>＋ Publicar estado</button><div class=panel><b>Estados recientes</b><div id=stories>...</div></div>`;if(mode==='users'||mode==='groups')l.querySelectorAll('.row').forEach(x=>x.onclick=()=>select(Number(x.dataset.id)));if($('newg'))$('newg').onclick=newGroup;if($('news'))$('news').onclick=newStory;if(mode==='status')loadStories();}
async function select(id){selected=(mode==='users'?users:groups).find(x=>x.id===id);app.classList.add('chatopen');$('who').innerHTML=mode==='users'?`<div class=me><div class=avatar>${esc(selected.name[0]?.toUpperCase())}</div><div><b>${esc(selected.name)}</b><div class=muted>@${esc(selected.username)} ${online.has(selected.id)?'· en línea':''}</div></div></div>`:`<div><b>👥 ${esc(selected.name)}</b><div class=muted>Grupo</div></div>`;renderList();load();}
async function load(){if(!selected)return;const ms=mode==='users'?await api('/api/messages/'+selected.id):await api('/api/groups/'+selected.id+'/messages');$('messages').innerHTML=ms.length?ms.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':'theirs'}">${mode==='groups'&&m.sender_id!==me.id?`<b>${esc(m.sender_name)}</b><br>`:''}${m.text?esc(m.text):''}${m.file_url?`<div><a href="${m.file_url}" target=_blank style=color:inherit;font-weight:800>📎 ${esc(m.file_name||'Archivo')}</a></div>`:''}<div class=time>${new Date(m.created_at.replace(' ','T')+'Z').toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class=empty>Aún no hay mensajes.<br>¡Manda el primero! 👋</div>';$('messages').scrollTop=$('messages').scrollHeight;}
async function send(e){e.preventDefault();if(!selected)return;let url='',name='',kind='text';if($('file').files[0]){const fd=new FormData();fd.append('file',$('file').files[0]);const d=await api('/api/upload',{method:'POST',body:fd});url=d.url;name=d.name;kind='file';$('file').value='';}const t=$('text').value.trim();if(!t&&!url)return;$('text').value='';socket.emit('send_message',mode==='users'?{to:selected.id,text:t,file_url:url,file_name:name,kind}:{group_id:selected.id,text:t,file_url:url,file_name:name,kind});}
let recorder,parts=[];async function voice(){if(!selected)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);parts=[];recorder.ondataavailable=e=>e.data.size&&parts.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(parts,{type:'audio/webm'});const fd=new FormData();fd.append('file',blob,'nota-de-voz.webm');const d=await api('/api/upload',{method:'POST',body:fd});socket.emit('send_message',mode==='users'?{to:selected.id,file_url:d.url,file_name:'🎙️ Nota de voz',kind:'voice'}:{group_id:selected.id,file_url:d.url,file_name:'🎙️ Nota de voz',kind:'voice'});};recorder.start();toast('Grabando… toca 🎙️ otra vez para enviar');$('voice').onclick=()=>{recorder.stop();$('voice').onclick=voice};}catch{toast('No se pudo usar el micrófono.')}}
async function newGroup(){const name=prompt('Nombre del grupo');if(!name)return;const ids=users.filter(u=>confirm(`¿Agregar a ${u.name}?`)).map(u=>u.id);await api('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,members:ids})});groups=await api('/api/groups');renderList();}
async function newStory(){const text=prompt('¿Qué quieres publicar?');if(text){await api('/api/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});loadStories();toast('Estado publicado');}}
async function loadStories(){const s=await api('/api/stories');$('stories').innerHTML=s.length?s.map(x=>`<div class=story><b>${esc(x.name)}</b><div>${esc(x.text)}</div><small class=muted>${new Date(x.created_at.replace(' ','T')+'Z').toLocaleString()}</small></div>`).join(''):'<p class=muted>No hay estados todavía.</p>';}
async function profile(){modal.innerHTML=`<div class=modal><div class=modalbox><h2>Tu perfil</h2><input class=field id=pname value="${esc(me.name)}"><textarea class=field id=pbio placeholder="Biografía">${esc(me.bio||'')}</textarea><button class="btn primary full" id=savep>Guardar</button><button class="btn full" id=closep style=margin-top:7px>Cancelar</button><button class="link" id=logout style=margin-top:12px> Cerrar sesión</button></div></div>`;$('closep').onclick=()=>modal.innerHTML='';$('logout').onclick=()=>{localStorage.removeItem('qs_token');location.reload()};$('savep').onclick=async()=>{await api('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pname').value,bio:$('pbio').value})});me=await api('/api/me');modal.innerHTML='';toast('Perfil actualizado');}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function handleCall(x){if(confirm('📞 Llamada entrante. ¿Aceptar?'))toast('Señal de llamada recibida. Para producción se conecta el módulo WebRTC.');}
if(token)start();else auth();
</script></body></html>
